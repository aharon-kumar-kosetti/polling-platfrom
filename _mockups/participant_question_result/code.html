<style>
        /* Editorial Playful Specific Adjustments */
        body { font-family: 'plusJakartaSans', sans-serif; }
        h1, h2, h3, .serif { font-family: 'ebGaramond', serif; }
        
        /* Soft Ambient Occlusion shadow based on guidance */
        .editorial-shadow {
            box-shadow: 0px 20px 40px rgba(21, 21, 21, 0.04);
        }

        /* Minimal Animations */
        @keyframes float-up {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.95); }
        }
        .animate-float { animation: float-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-pulse-slow { animation: pulse-slow 3s ease-in-out infinite; }
        
        /* Confetti structural styles */
        .confetti-piece {
            position: absolute;
            background-color: theme('colors.secondary-fixed');
            z-index: 0;
            opacity: 0;
            animation: float-up 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
