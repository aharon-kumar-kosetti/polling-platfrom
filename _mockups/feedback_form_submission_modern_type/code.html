<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Event Feedback</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300..800;1,300..800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#444748",
                        "surface-bright": "#fbf9f9",
                        "surface-container-highest": "#e4e2e2",
                        "on-primary-fixed-variant": "#474646",
                        "tertiary-fixed-dim": "#c8c7bf",
                        "surface-container": "#efeded",
                        "tertiary": "#000000",
                        "primary-fixed": "#e5e2e1",
                        "on-tertiary-container": "#85847d",
                        "surface-container-high": "#e9e8e7",
                        "surface": "#fbf9f9",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#b8d315",
                        "inverse-on-surface": "#f2f0f0",
                        "surface-dim": "#dbdad9",
                        "on-background": "#1b1c1c",
                        "tertiary-fixed": "#e4e2db",
                        "on-tertiary-fixed": "#1b1c17",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#c8c6c5",
                        "inverse-surface": "#303031",
                        "on-error": "#ffffff",
                        "inverse-primary": "#c8c6c5",
                        "on-primary-fixed": "#1c1b1b",
                        "secondary": "#576500",
                        "outline-variant": "#c4c7c7",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#f5f3f3",
                        "surface-tint": "#5f5e5e",
                        "tertiary-container": "#1b1c17",
                        "primary": "#000000",
                        "surface-variant": "#e4e2e2",
                        "on-primary": "#ffffff",
                        "secondary-container": "#d4f039",
                        "on-surface": "#1b1c1c",
                        "on-secondary-fixed-variant": "#414c00",
                        "on-secondary-container": "#5c6b00",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed-variant": "#474741",
                        "secondary-fixed": "#d4f039",
                        "primary-container": "#1c1b1b",
                        "background": "#fbf9f9",
                        "outline": "#747878",
                        "on-secondary-fixed": "#191e00",
                        "on-primary-container": "#858383"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "64px",
                        "container-padding": "24px",
                        "gutter": "16px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["-apple-system", "BlinkMacSystemFont", "SF Pro Text", "Segoe UI", "Roboto", "sans-serif"],
                        "display-sm": ["Poppins", "sans-serif"],
                        "display-lg": ["Poppins", "sans-serif"],
                        "label-md": ["-apple-system", "BlinkMacSystemFont", "SF Pro Text", "Segoe UI", "Roboto", "sans-serif"],
                        "headline-lg-mobile": ["Poppins", "sans-serif"],
                        "body-lg": ["-apple-system", "BlinkMacSystemFont", "SF Pro Text", "Segoe UI", "Roboto", "sans-serif"],
                        "headline-lg": ["Poppins", "sans-serif"],
                        "label-sm": ["-apple-system", "BlinkMacSystemFont", "SF Pro Text", "Segoe UI", "Roboto", "sans-serif"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-sm": ["48px", { "lineHeight": "1.1", "fontWeight": "600" }],
                        "display-lg": ["72px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "1.0", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "label-sm": ["12px", { "lineHeight": "1.0", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .blob-bg {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212, 240, 57, 0.15) 0%, rgba(212, 240, 57, 0) 70%);
            border-radius: 50%;
            top: -100px;
            right: -150px;
            z-index: -1;
            filter: blur(40px);
            pointer-events: none;
        }
        .form-enter {
            opacity: 0;
            transform: translateY(20px);
            animation: formFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes formFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen relative overflow-x-hidden selection:bg-secondary-container selection:text-on-secondary-container font-body-md">
<!-- Decorative Background Blob -->
<div class="blob-bg"></div>
<!-- TopNavBar -->
<header class="w-full top-0 sticky z-50 bg-surface border-b border-on-surface/10 flat no shadows">
<div class="flex justify-between items-center px-container-padding h-20 w-full max-w-7xl mx-auto">
<!-- Brand Logo -->
<div class="font-display-sm text-display-sm text-primary">
                QUIZCORE
            </div>
<!-- Navigation Links -->
<nav class="hidden md:flex gap-8">
<a class="font-body-md text-body-md uppercase tracking-wider text-on-surface-variant hover:text-secondary transition-colors scale-95 active:scale-90 transition-transform" href="#">Quiz</a>
<a class="font-body-md text-body-md uppercase tracking-wider text-on-surface-variant hover:text-secondary transition-colors scale-95 active:scale-90 transition-transform" href="#">Poll</a>
<a class="font-body-md text-body-md uppercase tracking-wider text-primary font-bold border-b-2 border-secondary hover:text-secondary transition-colors scale-95 active:scale-90 transition-transform h-full flex items-center pt-1" href="#">Feedback</a>
</nav>
<!-- Trailing Action -->
<button class="hidden md:inline-flex bg-primary text-on-primary px-6 py-3 rounded-full font-label-md text-label-md hover:opacity-90 transition-opacity active:scale-95">
                Create Session
            </button>
<!-- Mobile Menu Icon -->
<button class="md:hidden text-primary">
<span class="material-symbols-outlined" data-icon="menu" style="font-size: 28px;">menu</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="w-full max-w-3xl mx-auto px-container-padding py-section-gap flex flex-col items-center justify-center min-h-[calc(100vh-80px)]">
<!-- Feedback Form Container -->
<div class="w-full form-enter" id="feedback-form">
<div class="text-center mb-12">
<h1 class="font-display-lg text-display-lg text-primary mb-4 hidden md:block">Event Feedback</h1>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-4 md:hidden">Event Feedback</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-lg mx-auto">We'd love to hear your thoughts to help us improve future sessions.</p>
</div>
<form class="bg-surface-container-lowest rounded-[24px] p-8 md:p-12 border border-primary/10 shadow-[0px_20px_40px_rgba(21,21,21,0.04)]" onsubmit="handleFormSubmit(event)">
<!-- Rating Choice -->
<div class="mb-10">
<label class="block font-label-md text-label-md text-primary mb-4">How would you rate the session?</label>
<div class="flex flex-wrap gap-4">
<label class="cursor-pointer relative">
<input class="peer sr-only" name="rating" required="" type="radio" value="excellent">
<div class="px-6 py-3 rounded-full border border-primary/10 bg-surface-bright text-on-surface-variant font-body-md text-body-md peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-secondary-container hover:border-primary/30 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-icon="sentiment_very_satisfied">sentiment_very_satisfied</span>
                                Excellent
                            </div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="rating" type="radio" value="good">
<div class="px-6 py-3 rounded-full border border-primary/10 bg-surface-bright text-on-surface-variant font-body-md text-body-md peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-secondary-container hover:border-primary/30 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-icon="sentiment_satisfied">sentiment_satisfied</span>
                                Good
                            </div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="rating" type="radio" value="average">
<div class="px-6 py-3 rounded-full border border-primary/10 bg-surface-bright text-on-surface-variant font-body-md text-body-md peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-secondary-container hover:border-primary/30 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-icon="sentiment_neutral">sentiment_neutral</span>
                                Average
                            </div>
</label>
</div>
</div>
<!-- Text Input -->
<div class="mb-10">
<label class="block font-label-md text-label-md text-primary mb-4" for="highlight">What was the highlight?</label>
<input class="w-full bg-surface-bright border border-primary/10 rounded-full px-6 py-4 font-body-md text-body-md text-primary placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="highlight" name="highlight" placeholder="e.g. The live interactive poll..." type="text">
</div>
<!-- Textarea -->
<div class="mb-10">
<label class="block font-label-md text-label-md text-primary mb-4" for="improvements">Any suggestions for improvement?</label>
<textarea class="w-full bg-surface-bright border border-primary/10 rounded-[24px] px-6 py-4 font-body-md text-body-md text-primary placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow resize-none" id="improvements" name="improvements" placeholder="Share your thoughts..." rows="4"></textarea>
</div>
<!-- Submit Button -->
<div class="flex justify-center mt-section-gap">
<button class="bg-secondary-container text-on-secondary-container font-label-md text-label-md px-10 py-4 rounded-full hover:opacity-90 active:scale-95 transition-all w-full md:w-auto shadow-sm flex items-center justify-center gap-2 group" type="submit">
                        Submit Feedback
                        <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Success Message (Hidden by default) -->
<div class="hidden flex-col items-center justify-center text-center py-20 w-full form-enter" id="success-message">
<div class="w-24 h-24 bg-secondary-container rounded-full flex items-center justify-center mb-8 relative">
<div class="absolute inset-0 rounded-full border-4 border-secondary-container animate-[ping_1.5s_cubic-bezier(0,0,0.2,1)_infinite] opacity-20"></div>
<span class="material-symbols-outlined text-[48px] text-on-secondary-container" data-icon="check" data-weight="fill">check</span>
</div>
<h2 class="font-display-lg text-display-lg text-primary mb-4 hidden md:block">Thanks — got it!</h2>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-4 md:hidden">Thanks — got it!</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">Your feedback has been received and will help us make the next session even better.</p>
<button class="mt-12 bg-surface border border-primary/10 text-primary font-label-md text-label-md px-8 py-3 rounded-full hover:bg-surface-variant transition-colors" onclick="resetForm()">
                Back to Dashboard
            </button>
</div>
</main>
<script>
        function handleFormSubmit(event) {
            event.preventDefault();
            
            // Basic animation sequence
            const form = document.getElementById('feedback-form');
            const success = document.getElementById('success-message');
            
            form.style.opacity = '0';
            form.style.transform = 'translateY(-20px)';
            form.style.transition = 'all 0.4s ease';
            
            setTimeout(() => {
                form.classList.add('hidden');
                success.classList.remove('hidden');
                success.classList.add('flex');
            }, 400);
        }

        function resetForm() {
            const form = document.getElementById('feedback-form');
            const success = document.getElementById('success-message');
            
            success.style.opacity = '0';
            success.style.transform = 'translateY(20px)';
            success.style.transition = 'all 0.4s ease';
            
            setTimeout(() => {
                success.classList.add('hidden');
                success.classList.remove('flex');
                
                form.classList.remove('hidden');
                document.querySelector('form').reset();
                form.style.opacity = '1';
                form.style.transform = 'translateY(0)';
                
                // Reset success styles for next time
                success.style.opacity = '';
                success.style.transform = '';
            }, 400);
        }
    </script>
</body></html>
